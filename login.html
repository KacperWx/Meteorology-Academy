<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Meteorology Academy</title>

    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div class="background"></div>

<div class="login-container">

    <div class="login-card">

        <h1>Meteorology Academy</h1>

        <p class="subtitle">
            Sign in to continue your learning.
        </p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">

                Sign In

            </button>

        </form>

        <p id="errorMessage"></p>

        <div class="links">

            <a href="register.html">

                Create an account

            </a>

            <a href="#" id="resetPassword">

                Forgot password?

            </a>

        </div>

    </div>

</div>

<script type="module" src="js/auth.js"></script>

</body>

</html>
